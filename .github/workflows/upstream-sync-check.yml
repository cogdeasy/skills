name: Upstream drift check

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: elevenlabs/skills
  SYNC_BRANCH: upstream-sync
  PR_LABEL: upstream-sync
  ISSUE_LABEL: upstream-drift

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream and measure drift
        id: drift
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --quiet
          UPSTREAM_DEFAULT=$(git remote show upstream | sed -n 's/.*HEAD branch: //p')
          BEHIND=$(git rev-list --count "HEAD..upstream/${UPSTREAM_DEFAULT}")
          AHEAD=$(git rev-list --count "upstream/${UPSTREAM_DEFAULT}..HEAD")
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          echo "upstream_branch=${UPSTREAM_DEFAULT}" >> "$GITHUB_OUTPUT"

          # Skill directories deleted upstream but still present in the fork
          UPSTREAM_SKILLS=$(git ls-tree "upstream/${UPSTREAM_DEFAULT}" --name-only -d)
          REMOVED=""
          for dir in */; do
            dir="${dir%/}"
            [ -f "${dir}/SKILL.md" ] || continue
            if ! echo "${UPSTREAM_SKILLS}" | grep -qx "${dir}"; then
              REMOVED="${REMOVED:+${REMOVED} }${dir}"
            fi
          done
          echo "removed_skills=${REMOVED}" >> "$GITHUB_OUTPUT"

          {
            echo "commit_log<<EOF"
            git log --oneline "HEAD..upstream/${UPSTREAM_DEFAULT}" | head -30
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        id: merge
        if: steps.drift.outputs.behind != '0'
        env:
          UPSTREAM_BRANCH: ${{ steps.drift.outputs.upstream_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"

          git checkout -B "${SYNC_BRANCH}" "origin/${DEFAULT_BRANCH}"
          CONFLICTS=""
          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            # Commit the conflict markers as-is; the PR body flags them for
            # manual resolution.
            git add -A
            git commit -m "Merge upstream/${UPSTREAM_BRANCH} (unresolved conflicts)"
          fi
          {
            echo "conflict_files<<EOF"
            echo "${CONFLICTS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          git push --force origin "${SYNC_BRANCH}"

      - name: Open or update upstream-sync PR
        if: steps.drift.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          AHEAD: ${{ steps.drift.outputs.ahead }}
          UPSTREAM_BRANCH: ${{ steps.drift.outputs.upstream_branch }}
          REMOVED_SKILLS: ${{ steps.drift.outputs.removed_skills }}
          COMMIT_LOG: ${{ steps.drift.outputs.commit_log }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
          DEFAULT_BRANCH: ${{ steps.merge.outputs.default_branch }}
        run: |
          TITLE=$(python3 scripts/upstream_sync_pr.py --title)
          BODY=$(python3 scripts/upstream_sync_pr.py)

          gh label create "${PR_LABEL}" --repo "${GITHUB_REPOSITORY}" --color 0E8A16 \
            --description "Automated upstream sync" 2>/dev/null || true

          EXISTING=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${SYNC_BRANCH}" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base "${DEFAULT_BRANCH}" \
              --head "${SYNC_BRANCH}" --title "${TITLE}" --body "${BODY}" --label "${PR_LABEL}"
          fi

          # The sync PR supersedes any open drift issue
          ISSUE=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${ISSUE_LABEL}" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "${ISSUE}" ]; then
            gh issue close "${ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Superseded by the automated upstream-sync PR."
          fi

      - name: Open or update drift issue (removed skills only)
        if: steps.drift.outputs.behind == '0' && steps.drift.outputs.removed_skills != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REMOVED_SKILLS: ${{ steps.drift.outputs.removed_skills }}
        run: |
          TITLE="Fork drift: skills removed upstream but still present in this fork"
          BODY="## Upstream drift report

          The fork is up to date with \`${UPSTREAM_REPO}\`, but the following skill
          directories were removed upstream and are still present here:

          ${REMOVED_SKILLS}

          Consider removing these skill directories (and their \`evals/\` configs) to match upstream.

          _Last checked: $(date -u +'%Y-%m-%d %H:%M UTC') by the scheduled drift-check workflow._"

          gh label create "${ISSUE_LABEL}" --repo "${GITHUB_REPOSITORY}" --color D93F0B \
            --description "Fork has drifted behind upstream" 2>/dev/null || true

          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${ISSUE_LABEL}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}" --label "${ISSUE_LABEL}"
          fi

      - name: Close sync PR and drift issue when in sync
        if: steps.drift.outputs.behind == '0' && steps.drift.outputs.removed_skills == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${SYNC_BRANCH}" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "${PR}" ]; then
            gh pr close "${PR}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Fork is back in sync with ${UPSTREAM_REPO}. Closing." --delete-branch
          fi
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${ISSUE_LABEL}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue close "${EXISTING}" --repo "${GITHUB_REPOSITORY}" \
              --comment "Fork is back in sync with ${UPSTREAM_REPO}. Closing."
          fi
